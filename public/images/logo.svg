<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="smartBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="newsRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Icon: Modern Digital Newspaper + Lightning/Smart Badge -->
  <g transform="translate(6, 6)" filter="url(#dropShadow)">
    <!-- Base App Icon -->
    <rect x="0" y="0" width="50" height="50" rx="12" fill="url(#smartBlueGrad)" />
    <!-- Newspaper Fold / Pages -->
    <rect x="10" y="11" width="30" height="4" rx="2" fill="#ffffff" opacity="0.9" />
    <rect x="10" y="19" width="18" height="3.5" rx="1.75" fill="#ffffff" opacity="0.75" />
    <rect x="10" y="26" width="24" height="3.5" rx="1.75" fill="#ffffff" opacity="0.75" />
    <rect x="10" y="33" width="16" height="3.5" rx="1.75" fill="#ffffff" opacity="0.75" />
    <!-- Red Accent Flash / Live Dot -->
    <circle cx="37" cy="27" r="5" fill="url(#newsRedGrad)" />
    <circle cx="37" cy="27" r="2.5" fill="#ffffff" />
  </g>

  <!-- Typography: SmartNews -->
  <g transform="translate(68, 41)">
    <text font-family="'Noto Sans', 'Inter', -apple-system, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.8">
      <tspan fill="#1e3a8a" class="logo-smart">Smart</tspan>
      <tspan fill="#cf2e2e" class="logo-news">News</tspan>
    </text>
    <text x="1" y="13" font-family="'Noto Sans', -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.8" fill="#64748b" text-transform="uppercase">
      PORTAL BERITA TERPERCAYA
    </text>
  </g>
</svg>
