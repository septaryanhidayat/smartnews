<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="smartBlueGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="newsRedGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="url(#smartBlueGradDark)" />
    <rect x="10" y="11" width="30" height="4" rx="2" fill="#ffffff" opacity="0.95" />
    <rect x="10" y="19" width="18" height="3.5" rx="1.75" fill="#ffffff" opacity="0.85" />
    <rect x="10" y="26" width="24" height="3.5" rx="1.75" fill="#ffffff" opacity="0.85" />
    <rect x="10" y="33" width="16" height="3.5" rx="1.75" fill="#ffffff" opacity="0.85" />
    <circle cx="37" cy="27" r="5" fill="url(#newsRedGradDark)" />
    <circle cx="37" cy="27" r="2.5" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g transform="translate(68, 41)">
    <text font-family="'Noto Sans', 'Inter', -apple-system, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.8">
      <tspan fill="#ffffff">Smart</tspan>
      <tspan fill="#f87171">News</tspan>
    </text>
    <text x="1" y="13" font-family="'Noto Sans', -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.8" fill="#94a3b8" text-transform="uppercase">
      PORTAL BERITA TERPERCAYA
    </text>
  </g>
</svg>
